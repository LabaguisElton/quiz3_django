<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --ink: #172033;
            --muted: #687386;
            --accent: #e85d75;
            --accent-dark: #c7435b;
            --panel: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--ink);
            font-family: "Trebuchet MS", Verdana, sans-serif;
            background: #f8d9c5;
            background: linear-gradient(135deg, #f8d9c5 0%, #f8f3df 48%, #cce8e5 100%);
        }

        .page {
            width: min(100%, 1050px);
            margin: 0 auto;
        }

        .hero {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 34px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent-dark);
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            max-width: 600px;
            color: var(--ink);
            font-family: Georgia, serif;
            font-size: clamp(2.2rem, 6vw, 4.4rem);
            line-height: 0.98;
        }

        .summary {
            flex: 0 0 auto;
            padding: 16px 20px;
            color: white;
            background: var(--ink);
            border-radius: 16px;
            box-shadow: 8px 8px 0 rgba(23, 32, 51, 0.14);
            text-align: center;
        }

        .summary strong {
            display: block;
            color: #ffd27d;
            font-family: Georgia, serif;
            font-size: 2rem;
        }

        .summary span {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            position: relative;
            overflow: hidden;
            min-height: 180px;
            padding: 26px;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            box-shadow: 0 14px 30px rgba(62, 53, 64, 0.12);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .card::after {
            position: absolute;
            right: -28px;
            bottom: -34px;
            width: 110px;
            height: 110px;
            content: "";
            background: #ffd27d;
            border-radius: 50%;
            opacity: 0.55;
        }

        .card:hover {
            box-shadow: 0 18px 36px rgba(62, 53, 64, 0.18);
            transform: translateY(-5px);
        }

        .number {
            display: inline-grid;
            width: 38px;
            height: 38px;
            margin-bottom: 24px;
            place-items: center;
            color: white;
            background: var(--accent);
            border-radius: 50%;
            font-weight: bold;
        }

        .card h2 {
            position: relative;
            z-index: 1;
            margin: 0 0 10px;
            font-family: Georgia, serif;
            font-size: 1.55rem;
        }

        .card p {
            position: relative;
            z-index: 1;
            margin: 0;
            color: var(--muted);
        }

        .empty {
            padding: 36px;
            background: var(--panel);
            border-radius: 18px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 16px;
            }

            .hero {
                align-items: start;
                flex-direction: column;
            }

            .summary {
                width: 100%;
                text-align: left;
            }

            .summary strong,
            .summary span {
                display: inline;
                margin-right: 8px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="hero">
            <div>
                <p class="eyebrow">Class directory</p>
                <h1>Meet the students.</h1>
            </div>
            <div class="summary">
                <strong>{{ students|length }}</strong>
                <span>students enrolled</span>
            </div>
        </header>

        <section class="student-grid">
            {% for student in students %}
                <article class="card">
                    <span class="number">{{ forloop.counter }}</span>
                    <h2>{{ student.first_name }} {{ student.last_name }}</h2>
                    <p>Age {{ student.age }}</p>
                </article>
            {% empty %}
                <p class="empty">No students yet. Add some in the admin!</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
